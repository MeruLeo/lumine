services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_api_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: job_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumineV1}
      POSTGRES_USER: ${POSTGRES_USER:-HussainAqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-@Hossein2022}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-HussainAqa} -d ${POSTGRES_DB:-lumineV1}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
